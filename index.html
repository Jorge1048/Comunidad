<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manga PDF Manager</title>
<style>
/* CSS idéntico al original para mantener tu interfaz exacta */
:root{--bg:#0c0e14;--card:#161922;--in:#10121a;--line:#2a2d38;--tx:#ececf1;--mut:#9094a3;--red:#ff3355;--vio:#8b5cf6;--ok:#34d399;--warn:#f5b942;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:22px 14px 6px;text-align:center}
h1{margin:0;font:900 clamp(1.7rem,7vw,2.8rem) Impact,"Arial Black",sans-serif;letter-spacing:.04em;background:linear-gradient(90deg,#fff,var(--red) 60%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:.4rem 0 0;color:var(--mut);font-size:.85rem}
main,#app{display:grid;gap:14px}
main{max-width:920px;margin:auto;padding:12px 14px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 8px;font-size:1.02rem}
.drop{display:grid;place-items:center;gap:4px;min-height:150px;text-align:center;cursor:pointer;border:2px dashed var(--line);font-size:1.15rem}
.drop:hover,.drop.over{border-color:var(--red)}
.drop small,.hint{color:var(--mut);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stats div{background:var(--in);border-radius:10px;padding:9px 11px}
.stats span{display:block;color:var(--mut);font-size:.75rem}
.stats b{font-size:1rem;word-break:break-word}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row label{flex:1 1 220px;color:var(--mut);font-size:.88rem}
select,input{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
button{background:#262935;color:var(--tx);border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.primary{background:linear-gradient(90deg,var(--red),var(--vio));font-weight:700}
.wide{width:100%;padding:14px;font-size:1.05rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--in);border-radius:10px;padding:10px;border-left:4px solid var(--line)}
li.pending{border-color:var(--mut)}li.done{border-color:var(--ok)}li.warn{border-color:var(--warn)}li.error{border-color:var(--red)}li.off{opacity:.5}
#files li{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#files .sortable-ghost{opacity:.35;outline:2px dashed var(--red)}
li .info{flex:1 1 220px;min-width:0;word-break:break-word}
li small{display:block;color:var(--mut)}
li button{padding:6px 10px;font-size:.82rem}
.bar{height:12px;background:var(--in);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--vio));transition:width .2s}
.bar i.server{background:linear-gradient(90deg,var(--blue),var(--vio));}
.alert{border-color:var(--warn);background:#2a2412}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--red);border-radius:14px;width:min(92vw,460px);padding:18px}
dialog::backdrop{background:#000b}
dialog .row button{flex:1}
</style>
</head>
<body>
<header>
  <h1>MANGA PDF MANAGER</h1>
  <p>⚡ Híbrido: Local para lotes ligeros, nube segura para lotes pesados.</p>
</header>
<main>
  <div id="crash" class="card alert" hidden></div>
  <label id="drop" class="card drop">
    <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    <b>📂 Seleccionar archivos PDF</b><small>o arrástralos hasta aquí</small>
  </label>

  <section id="app" hidden>
    <div class="card"><div class="stats" id="stats"></div></div>
    <div class="card">
      <div class="row">
        <label>Tamaño máximo por lote (Recomendado 2 GB)<select id="max"></select></label>
        <button id="auto" hidden>↕ Orden automático</button>
        <button id="clear">🗑️ Limpiar</button>
      </div>
      <p class="hint" id="memHint"></p>
      <button id="go" class="primary wide">📚 CREAR PDFs</button>
    </div>
    <div class="card" id="prog" hidden></div>
    <div class="card"><h2>🔔 Notificaciones</h2><ul id="notes"></ul></div>
    <div class="card"><h2>Lotes</h2><ul id="batches"></ul></div>
    <div class="card"><h2>Archivos</h2><p class="hint">Mantén presionado un archivo y arrástralo para cambiar su posición.</p><ul id="files"></ul></div>
  </section>
</main>

<dialog id="dlg">
  <h3 style="margin:0 0 4px">✅ Lote listo</h3>
  <p class="hint" id="dinfo"></p>
  <input id="nm" aria-label="Nombre del archivo">
  <div class="row" style="margin-top:12px"><button id="skip">Omitir</button><button id="dl" class="primary">📥 Descargar PDF</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), MB = 1048576, GB = 1024 * MB;
const S = { items: [], events: [], warn: [], manga: 'Manga', running: false, manual: false, doneBatches: [] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = b => b >= GB ? (b / GB).toFixed(2) + ' GB' : (b / MB).toFixed(0) + ' MB';
const rng = (a, b) => a === b ? `${a}` : `${a}-${b}`;
const tick = () => new Promise(r => setTimeout(r, 30)); 
const ls = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} }, del: k => { try { localStorage.removeItem(k); } catch (_) {} } };
const doneSet = new Set(JSON.parse(ls.get('mpm_done') || '[]')); 
const keyOf = f => `${f.name}|${f.size}|${f.lastModified}`;

// Configuración de Arquitectura Híbrida
const SERVER_URL = 'http://localhost:3000'; // TODO: Cambia esto a la URL de tu backend
const LOCAL_LIMIT = 200 * MB; // Si el lote pesa menos de 200MB, se procesa en RAM del móvil. Si es más, al servidor.
const SIZES = [250, 500, 1000, 1500, 2000];
const sel = $('#max');
sel.innerHTML = SIZES.map(v => `<option value="${v}">${v >= 1000 ? v / 1000 + ' GB' : v + ' MB'}</option>`).join('');
sel.value = 2000; // Por defecto permitimos 2GB gracias al backend
const limit = () => +sel.value * MB;

const crashed = ls.get('mpm_run');
if (crashed) { ls.del('mpm_run'); $('#crash').hidden = false; $('#crash').innerHTML = `⚠️ Hubo un cierre abrupto anterior. Los lotes completados se han guardado.`; }

function parse(fn) {
  let s = fn.replace(/\.pdf$/i, '').replace(/_/g, ' '), copy = false;
  const c = s.match(/^(.*\S)\s+\((\d{1,2})\)\s*$/);
  if (c && /\d/.test(c[1])) { s = c[1]; copy = true; }
  const bad = { name: '', copy, start: null };
  let m = s.match(/(\d+(?:\.\d+)?)\s*[-–—~]\s*(\d+(?:\.\d+)?)/), a, b;
  if (m) { a = +m[1]; b = +m[2]; }
  else {
    m = s.match(/(\d+(?:\.\d+)?)(?=\)?\s*$)/); 
    if (!m || /\b(especial|special|extra|omake|oneshot)\b/i.test(s)) return bad;
    a = b = +m[1];
  }
  if (b < a) return bad;
  const name = s.slice(0, m.index).replace(/\b(caps?|cap[ií]tulos?|chapters?|ch|vol(umen|umenes)?|tomo|c)\b\.?/gi, '').replace(/[()\[\]]/g, ' ').replace(/^[\s\-–—:]+|[\s\-–—:]+$/g, '').replace(/\s+/g, ' ');
  return { name, copy, start: a, end: b };
}

function addFiles(list) {
  for (const f of list) {
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') continue;
    if (S.items.some(i => keyOf(i.file) === keyOf(f))) continue;
    const p = parse(f.name);
    S.items.push({ file: f, size: f.size, ...p, parsed: p.start !== null, status: doneSet.has(keyOf(f)) ? 'done' : 'pending', keep: null, err: '' });
  }
  $('#app').hidden = !S.items.length; render();
}

const active = i => i.parsed && !i.excluded && i.status !== 'error';
function analyze() {
  const it = S.items, lim = limit();
  if (!S.manual) it.sort((x, y) => (x.parsed === y.parsed ? 0 : x.parsed ? -1 : 1) || x.start - y.start || x.end - y.end || x.file.name.localeCompare(y.file.name, undefined, { numeric: true }));
  const cnt = {};
  it.forEach(i => { if (i.name) { const k = i.name.toLowerCase(); (cnt[k] = cnt[k] || { n: 0, name: i.name }).n++; } });
  const top = Object.values(cnt).sort((a, b) => b.n - a.n)[0];
  S.manga = top ? top.name : 'Manga';

  const groups = {}; S.warn = [];
  it.forEach(i => { i.dupKey = null; i.excluded = false; if (i.parsed) (groups[rng(i.start, i.end)] ||= []).push(i); });
  for (const [k, g] of Object.entries(groups)) {
    if (g.length < 2) continue;
    if (!g.some(i => i.keep)) { g.forEach(i => i.keep = false); [...g].sort((a, b) => a.copy - b.copy)[0].keep = true; }
    g.forEach(i => { i.dupKey = k; i.excluded = !i.keep; });
    S.warn.push(`⚠️ Posible duplicado: caps ${k} (${g.length} arch).`);
  }
  it.filter(i => !i.parsed).forEach(i => S.warn.push(`⚠️ No se pudo determinar el rango: ${i.file.name}`));
  it.filter(i => i.size > lim && i.status !== 'done').forEach(i => S.warn.push(`⚠️ ${i.file.name} pesa ${fmt(i.size)} y supera el lote máximo.`));
  it.filter(i => i.status === 'error').forEach(i => S.warn.push(`❌ Error en ${i.file.name}: ${i.err}`));
}

function batches() {
  const lim = limit(), out = []; let cur = null;
  for (const f of S.items.filter(i => active(i) && i.status === 'pending' && i.size <= lim)) {
    if (!cur || cur.size + f.size > lim) out.push(cur = { files: [], size: 0 });
    cur.files.push(f); cur.size += f.size;
  }
  out.forEach(b => { b.min = Math.min(...b.files.map(f => f.start)); b.max = Math.max(...b.files.map(f => f.end)); });
  return out;
}

function render() {
  analyze();
  const it = S.items, sum = fn => it.filter(fn).reduce((n, i) => n + i.size, 0), bs = batches();
  const ps = it.filter(i => i.parsed), errs = it.filter(i => i.status === 'error').length;
  const st = [['📚 Manga', S.manga], ['📄 Archivos', it.length], ['💾 Tamaño', fmt(sum(() => true))], ['✅ Listos', fmt(sum(i => i.status === 'done'))], ['⏳ Pendientes', bs.length]];
  $('#stats').innerHTML = st.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('');
  const ev = [...S.warn.map(t => ({ t })), ...S.events.map(e => ({ t: `${e.i} ${e.t}`, time: e.time }))];
  $('#notes').innerHTML = ev.map(e => `<li class="${e.t.startsWith('❌') ? 'error' : e.t.startsWith('⚠️') ? 'warn' : 'done'}"><span class="info">${esc(e.t)}</span><small>${e.time || ''}</small></li>`).join('') || '<li>Sin notificaciones.</li>';
  $('#batches').innerHTML = S.doneBatches.map(d => `<li class="done"><span class="info"><b>✅ ${esc(d.name)}</b><small>Capítulos ${d.r}</small></span></li>`).join('') +
    bs.map((b, n) => `<li class="pending"><span class="info"><b>⏳ Lote ${n + 1} ${b.size > LOCAL_LIMIT ? '☁️ (Nube)' : '📱 (Local)'}</b><small>Caps ${rng(b.min, b.max)} · ${fmt(b.size)}</small></span></li>`).join('') || '<li>No hay lotes.</li>';
  $('#files').innerHTML = it.map((i, n) => {
    const cls = i.status === 'done' ? 'done' : i.status === 'error' ? 'error' : (!i.parsed || i.dupKey || i.size > limit()) ? 'warn' : 'pending';
    return `<li data-n="${n}" class="${cls} ${i.excluded ? 'off' : ''}"><span class="info"><b>${{ done: '✅', error: '❌', warn: '⚠️', pending: '⏳' }[cls]} ${esc(i.file.name)}</b><small>${fmt(i.size)}</small></span>
      <span>${!i.parsed ? `<button data-a="set">Asignar</button> ` : ''}${i.dupKey && !i.keep ? `<button data-a="keep">Conservar</button> ` : ''}<button data-a="rm" aria-label="Quitar">✕</button></span></li>`;
  }).join('');
  $('#memHint').innerHTML = `💡 Los lotes pequeños (< 200 MB) se procesan en tu móvil. Los lotes pesados se procesan en la nube para no cerrar la aplicación por falta de memoria.`;
  $('#auto').hidden = !S.manual; $('#go').disabled = S.running || !bs.length;
}
const note = (i, t) => { S.events.unshift({ i, t, time: new Date().toLocaleTimeString() }); render(); };

function askName(def) {
  return new Promise(res => {
    const d = $('#dlg'); $('#nm').value = def; $('#dinfo').textContent = `Revisa el nombre del archivo final.`;
    const done = v => { d.close(); res(v); };
    $('#dl').onclick = () => done(($('#nm').value.trim() \vert{}\vert{} def).replace(/[\\/:*?"<>\vert{}]/g, '').replace(/\.pdf$/i, ''));
    $('#skip').onclick = () => done(null);
    d.oncancel = e => e.preventDefault(); d.showModal();
  });
}

async function saveFileLocal(bytes, name) {
  const fileName = name + '.pdf';
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 300000);
  return true;
}

function processServer(b, n, total) {
  return new Promise((resolve, reject) => {
    const batchId = 'batch_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    const fd = new FormData();
    b.files.forEach(f => fd.append('pdfs', f.file, f.file.name));

    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${SERVER_URL}/api/merge/${batchId}`, true);
    
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        $('#prog').innerHTML = `<h2>Lote ${n + 1} de ${total} (Nube)</h2><div>Subiendo archivos pesados...</div><div class="bar"><i class="server" style="width:${pct}%"></i></div><small class="hint">${pct}% de ${fmt(e.total)}</small>`;
      }
    };
    
    xhr.onload = () => {
      if (xhr.status === 200) {
        const res = JSON.parse(xhr.responseText);
        resolve(`${SERVER_URL}${res.downloadUrl}`);
      } else {
        reject(new Error('El servidor rechazó la solicitud. Revisa la conexión.'));
      }
    };
    xhr.onerror = () => reject(new Error('Error de red al conectar con el servidor.'));
    xhr.send(fd);
    $('#prog').innerHTML = `<h2>Lote ${n + 1} de ${total} (Nube)</h2><div>Iniciando subida...</div><div class="bar"><i class="server" style="width:5%"></i></div>`;
  });
}

async function processLocal(b, n, total) {
  let out = await PDFLib.PDFDocument.create(), read = 0;
  for (const f of b.files) {
    const pct = Math.round(read / b.size * 100);
    $('#prog').innerHTML = `<h2>Procesando lote ${n + 1} de ${total} (Local)</h2><div class="bar"><i style="width:${pct}%"></i></div><small class="hint">${pct}% · ${esc(f.file.name)}</small>`;
    await tick();
    let buf = await f.file.arrayBuffer(), src = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true, updateMetadata: false });
    (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p));
    buf = src = null; read += f.size;
  }
  $('#prog').innerHTML = `<h2>Lote ${n + 1} de ${total}: Construyendo PDF…</h2><div class="bar"><i style="width:100%"></i></div>`;
  await tick();
  let bytes = await out.save({ addDefaultPage: false }); out = null;
  return bytes;
}

async function run() {
  if (S.running) return;
  const bs = batches(); if (!bs.length) return;
  S.running = true; render(); $('#prog').hidden = false;
  let wl = null, aborted = false;
  try { wl = await navigator.wakeLock?.request('screen'); } catch (_) {}
  
  for (let n = 0; n < bs.length && !aborted; n++) {
    const b = bs[n];
    try {
      ls.set('mpm_run', JSON.stringify({ n: n + 1, mb: Math.round(b.size / MB) }));
      const isCloud = b.size > LOCAL_LIMIT;
      let url = null, bytes = null;
      
      const suggestedName = `(${b.min} - ${b.max}) ${S.manga}`;
      const name = await askName(suggestedName);
      if (!name) { note('⚠️', `Lote ${n + 1} omitido.`); continue; }

      if (isCloud) {
        url = await processServer(b, n, bs.length);
        // Descarga vía Server
        const a = document.createElement('a'); a.href = url; a.download = name + '.pdf';
        a.target = '_blank'; document.body.append(a); a.click(); a.remove();
      } else {
        bytes = await processLocal(b, n, bs.length);
        await saveFileLocal(bytes, name);
        bytes = null;
      }
      
      b.files.forEach(f => { f.status = 'done'; doneSet.add(keyOf(f.file)); });
      ls.set('mpm_done', JSON.stringify([...doneSet]));
      S.doneBatches.push({ name: name + '.pdf', r: rng(b.min, b.max) });
      note('🔔', `Lote terminado: ${name}`);

    } catch (e) {
      note('❌', `Lote ${n + 1} falló: ${e.message}`);
    } finally { ls.del('mpm_run'); }
  }
  S.running = false; $('#prog').hidden = true;
  if (wl) wl.release().catch(() => {});
  if (!aborted) note('🔔', 'Proceso terminado.');
}

$('#file').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
sel.onchange = render; $('#go').onclick = run; $('#auto').onclick = () => { S.manual = false; render(); };
$('#clear').onclick = () => { if (!confirm('¿Limpiar historial?')) return; Object.assign(S, { items: [], events: [], doneBatches: [], manual: false }); doneSet.clear(); ls.del('mpm_done'); render(); };
$('#files').onclick = e => {
  const b = e.target.closest('button'); if (!b || S.running) return;
  const n = +b.closest('li').dataset.n, i = S.items[n];
  if (b.dataset.a === 'rm') S.items.splice(n, 1);
  if (b.dataset.a === 'keep') S.items.filter(x => x.dupKey === i.dupKey).forEach(x => x.keep = x === i);
  if (b.dataset.a === 'set') {
    const m = (prompt(`Caps (ej: 12-20):`) || '').match(/^\s*(\d+(?:\.\d+)?)\s*(?:[-–]\s*(\d+(?:\.\d+)?))?\s*$/);
    if (m && (!m[2] || +m[2] >= +m[1])) { i.start = +m[1]; i.end = +(m[2] || m[1]); i.parsed = true; }
  }
  render();
};
if (window.Sortable) new Sortable($('#files'), { animation: 150, delay: 250, delayOnTouchOnly: true, filter: 'button', onEnd() { S.items = [...$('#files').children].map(li => S.items[+li.dataset.n]); S.manual = true; render(); }});
render();
</script>
</body>
</html>
